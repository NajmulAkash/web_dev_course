<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movement</title>
    <style>
        body{
            margin: 0;
            padding: 0;
        }
        .con{
            width: 100%;
            height: 100vh;
            background-color: aqua;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }
        .con1{
            width: 20%;
            height: 30%;
            background-color: red;
            border-radius: 3vh;
        } .con2{
            width: 20%;
            height: 30%;
            background-color: purple;
            border-radius: 3vh;
        }
         .con3{
            width: 20%;
            height: 30%;
            background-color: yellow;
            border-radius: 3vh;
        }
         .con4{
            width: 20%;
            height: 30%;
            background-color: green;
            border-radius: 3vh;
        }
    </style>
</head>
<body>
    <div class="con">
        <div class="con1"></div>
        <div class="con2"></div>
        <div class="con3"></div>
        <div class="con4"></div>
    </div>
</body>
</html>
